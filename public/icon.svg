<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="mm-bg" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#211852"/><stop offset="0.6" stop-color="#0c0a1c"/><stop offset="1" stop-color="#05050a"/>
    </radialGradient>
    <linearGradient id="mm-disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#fff6dc"/>
      <stop offset="0.82" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mm-halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dc"/><stop offset="0.45" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="mm-planet" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#e4ffb8"/><stop offset="0.5" stop-color="#b6ff5c"/><stop offset="1" stop-color="#3f9a2e"/>
    </radialGradient>
    <filter id="mm-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="mm-pc"><circle cx="384" cy="376" r="52"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#mm-bg)"/>
  <!-- Gargantua: halo lenteado -->
  <circle cx="246" cy="236" r="124" fill="none" stroke="url(#mm-halo)" stroke-width="22" filter="url(#mm-glow)" opacity="0.75"/>
  <circle cx="246" cy="236" r="120" fill="none" stroke="url(#mm-halo)" stroke-width="13"/>
  <!-- disco de acreção: parte de trás -->
  <path d="M40 236 A206 50 0 0 1 452 236" fill="none" stroke="url(#mm-disk)" stroke-width="16" opacity="0.5"/>
  <!-- horizonte de eventos -->
  <circle cx="246" cy="236" r="108" fill="#000"/>
  <!-- disco de acreção: frente -->
  <path d="M40 236 A206 50 0 0 0 452 236" fill="none" stroke="url(#mm-disk)" stroke-width="26" filter="url(#mm-glow)" opacity="0.65"/>
  <path d="M40 236 A206 50 0 0 0 452 236" fill="none" stroke="url(#mm-disk)" stroke-width="17"/>
  <!-- planeta de Miller com a onda gigante -->
  <circle cx="384" cy="376" r="58" fill="#05050a"/>
  <circle cx="384" cy="376" r="52" fill="url(#mm-planet)"/>
  <g clip-path="url(#mm-pc)">
    <path d="M326 392 C348 392 356 352 382 350 C398 349 404 366 392 372 C386 375 380 370 384 364 C398 380 414 392 444 392 L444 440 L326 440 Z" fill="#0f6b7d"/>
    <path d="M326 392 C348 392 356 352 382 350 C398 349 404 366 392 372" fill="none" stroke="#e8fbff" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
